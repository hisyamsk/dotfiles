# Kanagawa — monotone, matches waybar
#   bg      #1F1F28  sumiInk1
#   surface #2A2A37  sumiInk2
#   overlay #363646  sumiInk3
#   fg      #DCD7BA  fujiWhite
#   muted   #727169  fujiGray
#   accent  #7E9CD8  crystalBlue
#   warn    #FF9E3B  roninYellow
#   crit    #E46876  waveRed

# General
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Copy mode (prefix + [)
#   C-u / C-d   half page up / down
#   v           begin selection, C-v toggles block selection
#   y / Enter   yank to system clipboard and exit
setw -g mode-keys vi
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Escape send -X cancel

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1F1F28,fg=#DCD7BA"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[fg=#7E9CD8,bold] #S #[default] "
set -g status-right "#{?client_prefix,#[fg=#FF9E3B]PREFIX ,}#{?pane_in_mode,#[fg=#7E9CD8]COPY ,}#[fg=#727169]#h  #[fg=#DCD7BA,bold]%H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#727169] #I #W "
setw -g window-status-current-format "#[bg=#363646,fg=#DCD7BA,bold] #I #W "
setw -g window-status-activity-style "fg=#FF9E3B"
setw -g window-status-bell-style "fg=#E46876"

# Panes
set -g pane-border-style "fg=#2A2A37"
set -g pane-active-border-style "fg=#363646"
set -g display-panes-colour "#727169"
set -g display-panes-active-colour "#7E9CD8"

# Messages, prompts, copy-mode selection
set -g message-style "bg=#2A2A37,fg=#DCD7BA"
set -g message-command-style "bg=#2A2A37,fg=#7E9CD8"
setw -g mode-style "bg=#363646,fg=#DCD7BA"
setw -g copy-mode-match-style "bg=#2A2A37,fg=#7E9CD8"
setw -g copy-mode-current-match-style "bg=#7E9CD8,fg=#1F1F28"
setw -g clock-mode-colour "#7E9CD8"
